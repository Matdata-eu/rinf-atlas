server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MapLibre's worker is an ES module (.mjs); browsers refuse it as octet-stream.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json image/svg+xml application/x-protobuf
               application/vnd.mapbox-vector-tile;

    # Docker's DNS, re-resolved every 10 s so a recreated api container
    # (new IP) does not leave nginx proxying to the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
