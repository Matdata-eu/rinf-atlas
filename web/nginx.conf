# Scheme and host the client used, kept from a proxy in front of this one when
# it says so: the API writes absolute links (OGC API, TileJSON) with them.
map $http_x_forwarded_proto $atlas_proto { default $http_x_forwarded_proto; "" $scheme; }
map $http_x_forwarded_host $atlas_host { default $http_x_forwarded_host; "" $http_host; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MapLibre's worker is an ES module (.mjs); browsers refuse it as octet-stream.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json image/svg+xml application/x-protobuf
               application/vnd.mapbox-vector-tile;

    # Docker's DNS, re-resolved every 10 s so a recreated api container
    # (new IP) does not leave nginx proxying to the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Asks search engines not to index this instance unless ATLAS_PUBLIC_URL is set
    # (written at start by docker-entrypoint.d/40-atlas-seo.sh, docs/seo.md). nginx
    # drops inherited add_header in a location with its own, so those include it too.
    include /etc/nginx/atlas/robots.conf;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $atlas_proto;
        proxy_set_header X-Forwarded-Host $atlas_host;
        proxy_read_timeout 120s;
    }

    # Exports of a whole class can take minutes to prepare (XLSX is sent only once
    # complete); stream CSV straight through instead of buffering it.
    location /api/export {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/atlas/robots.conf;
        try_files $uri =404;
    }

    # Deployer-supplied pages (privacy statement), mounted from ./site; never
    # fall back to the app, so the frontend can tell whether a page exists.
    location /site/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/atlas/robots.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/atlas/robots.conf;
    }

    # Generated at start; never answered by the app's index.html.
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
