<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Faceted map search over the EU Register of Infrastructure (ERA RINF)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4fa8'/%3E%3Cpath d='M8 26 14 6M24 26 18 6M10 20h12M11.5 14h9' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>RINF Atlas</title>
    <script>
      // Apply a forced light/dark theme before first paint (see src/theme.ts).
      try { var t = localStorage.getItem('atlas-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true"></span><span>RINF Atlas</span></div>
      <label class="env">
        <span class="sr-only">Environment</span>
        <select id="env-select" aria-label="Environment"></select>
      </label>
      <div class="search">
        <input id="q" type="search" placeholder="Search labels, codes…" autocomplete="off" aria-label="Full-text search" />
      </div>
      <div id="status" class="status" title="Dataset status"></div>
      <button id="share-btn" class="btn share-btn" type="button" title="Copy a link to this exact view: map, filters, selection and the tools you have open" aria-label="Share a link to this view"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="12" cy="3.5" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="4" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12.5" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m5.8 7 4.4-2.5M5.8 9l4.4 2.5" stroke="currentColor" stroke-width="1.5"/></svg><span class="share-label">Share</span></button>
      <button id="theme-btn" class="icon-btn theme-btn" type="button"></button>
      <button id="help-btn" class="icon-btn theme-btn" type="button" title="Help: how to use RINF Atlas" aria-label="Help"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.1 6.2a1.95 1.95 0 1 1 2.7 1.8c-.5.2-.8.6-.8 1.1v.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.6" r="1" fill="currentColor"/></svg></button>
      <button id="about-btn" class="icon-btn theme-btn" type="button" title="About, credits and feedback" aria-label="About, credits and feedback"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg></button>
    </header>

    <main class="layout">
      <aside id="side" class="side" aria-label="Filters and results">
        <div class="side-head">
          <button id="sheet-toggle" class="sheet-handle" aria-label="Expand panel"><span></span></button>
          <div class="tabs" role="tablist">
            <button role="tab" class="tab" data-tab="filters" aria-selected="true">Filters</button>
            <button role="tab" class="tab" data-tab="results" aria-selected="false">Results <span id="result-count" class="badge"></span></button>
          </div>
        </div>
        <div class="side-body">
          <section id="pane-filters" class="pane">
            <div id="chips" class="chips"></div>
            <label class="toggle"><input id="limit-view" type="checkbox" /> Limit to map view</label>
            <h2 class="section-title" id="colorby-title">Map colours</h2>
            <div class="colorby">
              <button id="colorby-btn" class="colorby-btn" type="button" aria-haspopup="dialog" aria-describedby="colorby-title"></button>
              <button id="colorby-clear" class="icon-btn colorby-clear" type="button" title="Back to class colours" aria-label="Back to class colours" hidden>×</button>
            </div>
            <h2 class="section-title">Classes</h2>
            <ul id="class-list" class="class-list"></ul>
            <h2 class="section-title">Filters for every class</h2>
            <div id="facets"></div>
          </section>
          <section id="pane-results" class="pane" hidden>
            <div class="export-bar">
              <span class="muted">Export results</span>
              <button id="export-csv" class="btn btn-small" type="button" title="Download every matching feature as one CSV table (UTF-8)">CSV</button>
              <button id="export-xlsx" class="btn btn-small" type="button" title="Download every matching feature as an Excel workbook, one sheet per class">Excel</button>
              <button id="export-ttl" class="btn btn-small" type="button" title="Download the outgoing triples of every matching entity as Turtle, fetched live from ERA">Turtle</button>
              <button id="export-gis" class="btn btn-small" type="button" title="Copy the OGC API URL of these results, to load them as layers in QGIS or ArcGIS">Open in GIS</button>
            </div>
            <p id="export-msg" class="export-msg" hidden></p>
            <ol id="results" class="results"></ol>
            <button id="results-more" class="btn btn-block" hidden>Load more</button>
          </section>
        </div>
      </aside>

      <section class="map-wrap">
        <div id="map" class="map"></div>
        <div class="map-tools" role="toolbar" aria-label="Map tools">
          <div class="tool-group">
            <button id="profile-btn" class="btn tool-btn" type="button" aria-pressed="false" title="Parameters along a national line or a series of sections of line"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1.5 13.5h13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="m2 10.5 3.2-4 3 2.5L14 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Line profile</span></button>
            <button id="vehicle-btn" class="btn tool-btn" type="button" aria-pressed="false" aria-expanded="false" aria-controls="vehicle-panel" title="Where can a vehicle type run? Colour the sections of line by compatibility"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="3" y="1.75" width="10" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 7h9" stroke="currentColor" stroke-width="1.4"/><circle cx="5.8" cy="9.4" r=".9" fill="currentColor"/><circle cx="10.2" cy="9.4" r=".9" fill="currentColor"/><path d="m5 12-1.8 2.5M11 12l1.8 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Vehicle check</span></button>
          </div>
          <div id="qa-legend" class="qa-legend btn-raised" hidden>
            <span><i class="qa-dot sev-violation"></i>Violation</span>
            <span><i class="qa-dot sev-warning"></i>Warning</span>
            <span><i class="qa-dot sev-info"></i>Info</span>
          </div>
        </div>
        <!-- Moved into MapLibre's top-right control stack by map.ts: zoom buttons, then the layers menu. -->
        <div id="map-ctrl-nav" class="maplibregl-ctrl maplibregl-ctrl-group">
          <button id="zoom-in" class="maplibregl-ctrl-zoom-in" type="button" title="Zoom in" aria-label="Zoom in"><span class="maplibregl-ctrl-icon" aria-hidden="true"></span></button>
          <button id="zoom-out" class="maplibregl-ctrl-zoom-out" type="button" title="Zoom out" aria-label="Zoom out"><span class="maplibregl-ctrl-icon" aria-hidden="true"></span></button>
          <button id="zoom-results" class="ctrl-svg" type="button" title="Zoom to the extent of all matching features" aria-label="Zoom to results"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 5.5V2h3.5M10.5 2H14v3.5M14 10.5V14h-3.5M5.5 14H2v-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/></svg></button>
        </div>
        <div id="map-ctrl-layers" class="maplibregl-ctrl layers-ctrl">
          <div class="maplibregl-ctrl-group">
            <button id="layers-btn" class="ctrl-svg" type="button" title="Map layers" aria-label="Map layers" aria-haspopup="true" aria-expanded="false" aria-controls="layers-menu"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 1.8 14.5 5 8 8.2 1.5 5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="m1.5 8 6.5 3.2L14.5 8M1.5 11l6.5 3.2 6.5-3.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <div id="layers-menu" class="layers-menu" role="group" aria-label="Map layers" hidden>
            <h2 class="section-title">Map layers</h2>
            <label class="layer-opt"><input id="orm-toggle" type="checkbox" /><span><b>OpenRailwayMap</b><small>Rail infrastructure drawn over the OpenStreetMap basemap</small></span></label>
            <label id="qa-tool" class="layer-opt" hidden><input id="qa-toggle" type="checkbox" /><span><b>Data issues</b><small>Rings features on which ERA's SHACL shapes found problems, by worst severity</small></span></label>
          </div>
        </div>
        <div id="map-msg" class="map-msg" hidden></div>
        <section id="profile" class="profile" aria-label="Line profile" hidden></section>
        <section id="vehicle-panel" class="vehicle-panel" role="dialog" aria-modal="false" aria-labelledby="vehicle-panel-title" hidden>
          <button class="sheet-handle vehicle-handle" type="button" aria-label="Expand or shrink the vehicle check"><span></span></button>
          <div class="vehicle-panel-head">
            <h2 id="vehicle-panel-title">Vehicle check</h2>
            <button id="vehicle-close" class="icon-btn" type="button" title="Close the panel (the colouring stays on)" aria-label="Close the vehicle check panel">×</button>
          </div>
          <div id="pane-vehicle" class="vehicle-panel-body"></div>
        </section>
      </section>

      <aside id="detail" class="detail" aria-label="Feature details" hidden></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
