name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check commit subjects
        run: bash scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  python:
    name: Python (lint + worker tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            worker/pyproject.toml
            api/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./worker -r api/requirements.txt pytest ruff
      - name: Lint
        run: ruff check worker api
      - name: Worker tests
        run: pytest -q worker/tests
      - name: API tests
        run: pytest -q api/tests
      - name: Shapes compile
        env:
          ATLAS_CONFIG: config/environments.yaml
          ATLAS_SHAPES: shapes
        run: atlas check-shapes > /dev/null
      - name: API imports
        working-directory: api
        run: python -c "import app.query"

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Mock API parses
        run: node --check mock/server.mjs

  e2e:
    name: End-to-end (docker compose + sample data)
    runs-on: ubuntu-latest
    needs: [python, web]
    timeout-minutes: 30
    env:
      ATLAS_ENVS: prod
      ATLAS_PORT: "8080"
      ATLAS_IMAGE: local/rinf-atlas
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config -q
      - name: Build and start
        run: docker compose up -d --build --wait db api web
      - name: Smoke test
        run: bash tests/smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser tests
        working-directory: web
        run: npm ci --no-audit --no-fund
      # The runner's Google Chrome: `playwright install` hung after its download.
      - name: Browser tests
        working-directory: web
        timeout-minutes: 10
        env:
          PW_CHANNEL: chrome
        run: npm run test:e2e
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
