name: Publish images

# Builds the worker, api and web images and pushes them to GitHub Container
# Registry: `latest` and `sha-…` on every push to main, `X.Y.Z` / `X.Y` on
# version tags (v1.2.3). Pull requests that touch an image only build it
# (both architectures) without pushing. docker-compose.yml uses these names, so
# `docker compose pull && docker compose up -d` runs a published release.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths: ["worker/**", "api/**", "web/**", ".github/workflows/docker-publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: worker
            context: .
            dockerfile: worker/Dockerfile
          - service: api
            context: .
            dockerfile: api/Dockerfile
          - service: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=rinf-atlas-${{ matrix.service }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
