# Environments RINF Atlas can index. Each one is ingested into the same
# database, tagged with its key, and the UI lets users switch between them.
#
# sparql:        ERA GraphDB repository (SPARQL endpoint + RDF4J REST API).
#                Used by the worker to download named graphs and by the API
#                for the live "describe" / graph traversal only.
# datasets_api:  ERA portal API; GET {datasets_api}/dataset/published?latest=true&groupBy=im
#                is what the dataset explorer page shows (latest upload per IM).
# portal:        ERA portal base URL (links in the UI).
# vocab_graphs:  named graphs loaded into the local mirror next to the
#                provider data (ontology, SKOS concept schemes, countries),
#                for labels and shape generation.
# include_graphs / exclude_graphs: optional Python regexes on graph IRIs.
#                The environment variable ATLAS_ONLY_GRAPHS (comma separated
#                IRIs or IM codes) overrides include_graphs, handy for tests.
#
# Verified 2026-10-14: PROD ontology v3.3.4, UAT ontology v4.0.0.
environments:
  prod:
    label: PROD
    default: true
    sparql: https://graph.data.era.europa.eu/repositories/rinf-plus
    datasets_api: https://rinf.data.era.europa.eu/api/v1
    portal: https://rinf.data.era.europa.eu
    vocab_graphs:
      - http://data.europa.eu/949/graph/rinf/ontology
      - http://data.europa.eu/949/graph/rinf/skos
      - http://data.europa.eu/949/graph/rinf/countries
  uat:
    label: UAT
    sparql: https://graph.uat.data.test-era.europa.eu/repositories/rinf-plus
    datasets_api: https://rinf.uat.data.test-era.europa.eu/api/v1
    portal: https://rinf.uat.data.test-era.europa.eu
    vocab_graphs:
      - http://data.europa.eu/949/graph/rinf/ontology
      - http://data.europa.eu/949/graph/rinf/skos
      - http://data.europa.eu/949/graph/rinf/countries

# Provider data lives in one named graph per infrastructure manager:
# http://data.europa.eu/949/graph/{organisation code}, e.g. .../graph/0088
# for Infrabel. Graphs matching this pattern are indexed.
provider_graph_pattern: "^http://data\\.europa\\.eu/949/graph/[A-Z0-9]{4}$"

# How often the worker checks for new or changed datasets.
poll_interval_minutes: 30

# Graphs never indexed as provider data, even if they match the pattern.
exclude_graphs: []

# Data quality: after a provider graph is (re)loaded, the worker validates it
# against the SHACL shapes ERA publishes in its repository (the shapes graph is
# mirrored like the vocabularies) and stores the results in PostGIS. Only new
# or changed graphs are validated, and all of them again when ERA changes the
# shapes. See docs/datasets.md ("Data quality").
quality:
  enabled: true                       # ATLAS_QUALITY=0 turns validation off
  shapes_graph: http://data.europa.eu/949/graph/rinf/shacl
  max_triples: 15000000               # larger graphs are not validated (ATLAS_QUALITY_MAX_TRIPLES)
  time_budget_minutes: 60             # per graph; then the report is marked partial (ATLAS_QUALITY_MINUTES)
  max_results_per_constraint: 10000   # results stored per shape and constraint (all are counted)
  max_results_per_graph: 200000       # results stored per graph
  html_max_results: 20000             # build a shacl-report HTML viewer up to this many results (0 = never)
  # Node shapes, property shapes or named sh:sparql constraints (IRIs or regexes) to
  # leave out. The two below are ERA warnings ("RunningTrack must give
  # linesideDistanceIndication / maxPermittedTrainLength when part of a section of
  # line / freight corridor") whose SPARQL takes about 5 minutes each on a 676k-triple
  # graph (0088) and far longer on the largest ones; they were 75% of 0088's run.
  # Set `exclude_shapes: []` to check them too. A change re-validates every graph.
  exclude_shapes:
    - http://data.europa.eu/949/shapes/LinesideDistanceIndicationRequiredForSoL
    - http://data.europa.eu/949/shapes/MaxPermittedTrainLengthApplicability
