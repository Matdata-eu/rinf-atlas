# Describe index for RINF Describe (docs/describe.md), on top of the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.describe.yml up -d
#
# The worker then also stores every triple and one precomputed describe page per
# resource, from the shapes in ATLAS_DESCRIBE_SHAPES_DIR. Atlas itself never reads them.
services:
  worker:
    environment:
      ATLAS_DESCRIBE: "1"
    volumes:
      - ${ATLAS_DESCRIBE_SHAPES_DIR:?set ATLAS_DESCRIBE_SHAPES_DIR to RINF Describe's shapes folder}:/app/describe-shapes:ro
